// Buildscript classpath for AGP and Kotlin (both resolved from the Gradle cache).
// Versions match the K2Go toolchain so the local cache is reused: AGP 8.9.1 on
// Gradle 8.11.1.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
